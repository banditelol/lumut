[project]
site_name = "lumut"
site_description = "Experimental AnyWidget data editor for notebooks"
site_url = "https://banditelol.github.io/lumut/"
repo_url = "https://github.com/banditelol/lumut"
repo_name = "banditelol/lumut"
docs_dir = "docs"
site_dir = "site"

nav = [
    { Overview = "index.md" },
    { Reference = [
        { "data_editor_enchance" = "reference/data-editor-enchance.md" },
        { "exp_data_editor" = "reference/exp-data-editor.md" },
    ] },
]

extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
language = "en"
features = ["content.code.copy", "navigation.expand", "navigation.instant", "search.highlight", "toc.follow"]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
merge_init_into_class = true
show_source = true
show_root_heading = false
show_signature = true
show_signature_annotations = true
heading_level = 2

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = "#"
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true
