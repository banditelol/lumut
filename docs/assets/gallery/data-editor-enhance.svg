  <g font-family="system-ui, sans-serif" font-size="20" fill="#1e293b"><text x="118" y="236">1</text><text x="190" y="236">Ada Lovelace</text><text x="485" y="222">Visible rows are sampled while the column is resized.</text><text x="485" y="250">The maximum is capped and reused after release.</text><text x="1080" y="236">✓</text><text x="118" y="334">2</text><text x="190" y="334">Grace Hopper</text><text x="485" y="320">This deliberately trades exact fit for responsive</text><text x="485" y="348">resizing on eager, small-to-medium data.</text><text x="1080" y="334">□</text><text x="118" y="430">3</text><text x="190" y="430">Katherine Johnson</text><text x="485" y="416">Rows outside the sampled window can be imperfect.</text><text x="1080" y="430">✓</text></g>
