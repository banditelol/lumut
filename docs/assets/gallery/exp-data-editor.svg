<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">exp_data_editor gallery preview</title>
  <desc id="desc">A data editor with resized columns and two wrapped rows.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="70" y="58" width="820" height="424" rx="14" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/>
  <text x="102" y="101" fill="#1f2937" font-family="Arial, sans-serif" font-size="20" font-weight="700">Experimental data editor</text>
  <line x1="70" y1="124" x2="890" y2="124" stroke="#d7dce3" stroke-width="2"/>
  <rect x="72" y="125" width="816" height="46" fill="#f1f5f9"/>
  <text x="102" y="153" fill="#64748b" font-family="Arial, sans-serif" font-size="13" font-weight="700">NAME</text>
  <text x="302" y="153" fill="#64748b" font-family="Arial, sans-serif" font-size="13" font-weight="700">ROLE</text>
  <text x="514" y="153" fill="#64748b" font-family="Arial, sans-serif" font-size="13" font-weight="700">NOTES</text>
  <line x1="274" y1="125" x2="274" y2="450" stroke="#d7dce3"/>
  <line x1="486" y1="125" x2="486" y2="450" stroke="#d7dce3"/>
  <line x1="70" y1="171" x2="890" y2="171" stroke="#d7dce3"/>
  <text x="102" y="206" fill="#1f2937" font-family="Arial, sans-serif" font-size="16">Ada Lovelace</text>
  <text x="302" y="206" fill="#1f2937" font-family="Arial, sans-serif" font-size="16">Mathematician</text>
  <text x="514" y="198" fill="#1f2937" font-family="Arial, sans-serif" font-size="15">Long text wraps only for visible rows.</text>
  <text x="514" y="220" fill="#1f2937" font-family="Arial, sans-serif" font-size="15">Column resizing remeasures lazily.</text>
  <line x1="70" y1="242" x2="890" y2="242" stroke="#d7dce3"/>
  <text x="102" y="280" fill="#1f2937" font-family="Arial, sans-serif" font-size="16">Grace Hopper</text>
  <text x="302" y="280" fill="#1f2937" font-family="Arial, sans-serif" font-size="16">Computer scientist</text>
  <text x="514" y="271" fill="#1f2937" font-family="Arial, sans-serif" font-size="15">Rows stop growing at max_row_height,</text>
  <text x="514" y="293" fill="#1f2937" font-family="Arial, sans-serif" font-size="15">keeping scrolling predictable.</text>
  <rect x="481" y="126" width="6" height="324" rx="3" fill="#14b8a6" opacity=".9"/>
  <rect x="872" y="185" width="6" height="148" rx="3" fill="#cbd5e1"/>
</svg>
