[project]
name = "lumut"
version = "0.1.0"
description = "Experimental AnyWidget data editor for notebook environments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lumut contributors" }]
dependencies = ["anywidget>=0.11.0", "traitlets>=5.14.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
docs = ["zensical>=0.0.38", "mkdocstrings[python]>=0.25.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
only-packages = true
artifacts = ["lumut/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
